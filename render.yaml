# Render blueprint -- 2 services. Owner: R6 (DevOps).
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
#
# Fusion recompute and Postgres both moved off Render (see docs/ARCHITECTURE.md):
#   - Postgres -> Supabase. Free tier, plain Postgres 15 underneath, no code change --
#     DATABASE_URL is set below as a plain env var (sync: false, set it per-environment
#     in the Render dashboard). Supabase's connection string needs the driver swapped to
#     `postgresql+psycopg://` and `?sslmode=require` appended.
#   - Fusion cron -> n8n's satellite-trigger workflow already POSTs /api/fusion/run on a
#     schedule (automation/n8n/README.md); a Render Background Worker doing the same job
#     was redundant once something external is pinging the API anyway. The same external
#     pinger keeps the free web service from spinning down after 15 min idle.
services:
  - type: web
    name: neerdrishti-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.init_db && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: INGEST_TOKEN
        generateValue: true
      - key: CITY_DEFAULT
        value: Jaipur
      - key: CORS_ORIGINS
        value: https://neerdrishti-web.onrender.com

  - type: web
    name: neerdrishti-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://neerdrishti-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
