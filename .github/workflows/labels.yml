name: Auto-label PRs

# Advisory only. This workflow is deliberately NOT in the required-status-check list,
# so a labelling failure can never block a merge.
#
# Three things get labelled automatically:
#   1. lane      -- from the files touched (.github/labeler.yml, mirrors CODEOWNERS)
#   2. size      -- from the diff size, so an oversized PR is obvious in the list
#   3. ai-*      -- from the AI disclosure box in the PR body (CONTRIBUTING §7)
#
# (3) is the point. CONTRIBUTING used to ask people to add the label by hand, which is
# exactly the kind of step everyone forgets at 1am.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lane:
    name: Lane labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

  size-and-disclosure:
    name: Size + AI disclosure labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            // ---- size, from the diff ------------------------------------
            // CONTRIBUTING §5.3 asks for under 400 changed lines. A visible size:XL
            // makes an unreviewable PR obvious before anyone opens it.
            const churn = pr.additions + pr.deletions;
            const size = churn <  20 ? 'size:XS'
                       : churn < 100 ? 'size:S'
                       : churn < 400 ? 'size:M'
                       : churn < 1000 ? 'size:L'
                       :                'size:XL';

            // ---- AI disclosure, from the PR body (CONTRIBUTING §7) -------
            const body = pr.body || '';
            const ticked = (re) => {
              const m = body.match(re);
              return !!m && m[1].toLowerCase() === 'x';
            };
            const assisted  = ticked(/-\s*\[([ xX])\]\s*AI-assisted/i);
            const generated = ticked(/-\s*\[([ xX])\]\s*\**Substantially agent-generated/i);
            const byHand    = ticked(/-\s*\[([ xX])\]\s*Written entirely by hand/i);

            const want = new Set([size]);
            if (assisted)  want.add('ai-assisted');
            if (generated) want.add('agent-generated');

            // Labels this workflow owns. Anything in here that we no longer want gets
            // removed, so editing the PR body actually corrects the label rather than
            // leaving both states stuck on the PR.
            const managed = ['size:XS','size:S','size:M','size:L','size:XL',
                             'ai-assisted','agent-generated'];

            const current = pr.labels.map(l => l.name);
            const toAdd    = [...want].filter(l => !current.includes(l));
            const toRemove = managed.filter(l => current.includes(l) && !want.has(l));

            if (toAdd.length) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number, labels: toAdd });
            }
            for (const name of toRemove) {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: pr.number, name }).catch(() => {});
            }

            core.notice(
              `${churn} lines changed -> ${size}` +
              (generated ? ' | agent-generated' : assisted ? ' | ai-assisted'
               : byHand ? ' | hand-written' : ' | no disclosure ticked')
            );

            if (!assisted && !generated && !byHand) {
              core.warning('No AI disclosure box is ticked -- the PR hygiene check will fail this PR (CONTRIBUTING §7).');
            }
